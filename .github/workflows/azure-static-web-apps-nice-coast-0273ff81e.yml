name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - '**'

# Add permissions for the workflow
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-22.04
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build solution
        run: dotnet build --configuration Release --no-restore
      
      - name: Setup Node.js for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json
      
      - name: Install JavaScript dependencies
        run: |
          cd Client
          npm ci
      
      - name: Run JavaScript Unit Tests
        run: |
          cd Client
          npm test -- --ci --coverage --maxWorkers=2
        continue-on-error: false
      
      - name: Upload JavaScript Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-coverage
          path: Client/coverage/
          retention-days: 30
      
      - name: Install Playwright Browsers
        run: pwsh TestProject1/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      
      - name: Run Unit Tests
        run: |
          dotnet test TestProject1/TestProject1.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --filter "TestCategory!=Manual&TestCategory!=Interactive" \
            --logger "trx;LogFileName=test-results.trx"
        continue-on-error: false
      
      - name: Run Playwright Tests
        run: |
          dotnet test TestProject1/TestProject1.csproj \
            --configuration Release \
            --no-build \
            --filter "TestCategory=Automated" \
            --logger "trx;LogFileName=playwright-results.trx" \
            --logger "console;verbosity=detailed"
        continue-on-error: true
        env:
          PLAYWRIGHT_VIDEO: 'on'
          PLAYWRIGHT_SCREENSHOTS: 'on'
      
      - name: Publish Test Results Summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/TestResults/**/*.trx
          check_name: "Test Results"
          comment_mode: off
    
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml
          retention-days: 30
      
      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            TestProject1/bin/Release/net8.0/playwright-videos/**/*
            TestProject1/bin/Release/net8.0/playwright-screenshots/**/*
            TestProject1/bin/Release/net8.0/playwright-traces/**/*
          retention-days: 30
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_COAST_0273FF81E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client"
          api_location: "Api"
          output_location: "wwwroot"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-22.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_COAST_0273FF81E }}
          action: "close"
