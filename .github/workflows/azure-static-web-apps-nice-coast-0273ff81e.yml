name: Azure Static Web Apps CI/CD

run-name: "Deploy to Azure SWA - ${{ github.event.head_commit.message || github.event.pull_request.title }}"

on:
  push:
    branches:
      - main  # Only deploy main branch to production
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main  # PRs targeting main get preview deployments

# Add permissions for the workflow
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-22.04
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: "Restore .NET workloads"
        # Use workload restore in CI (faster and reads manifest). This ensures wasm-tools is available
        # without performing an explicit install which can be slower in CI runners.
        run: dotnet workload restore

      - name: "Diagnostic: .NET SDK & workloads"
        # Helpful diagnostics when CI reports missing workloads (NETSDK1147)
        run: |
          echo "---- dotnet --info ----"
          dotnet --info || true
          echo "---- dotnet --list-sdks ----"
          dotnet --list-sdks || true
          echo "---- dotnet workload list ----"
          dotnet workload list || true
          echo "---- dotnet workload restore (dry-run) ----"
          dotnet workload restore --skip-manifest-update || true
          echo "---- ls -la /usr/share/dotnet/sdks ----"
          ls -la /usr/share/dotnet/sdks || true
          echo "---- environment vars relevant to dotnet ----"
          env | grep -i DOTNET || true
        shell: bash
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: "Publish Blazor WebAssembly (includes build)"
        # Disable WebAssembly SIMD for broader device/browser compatibility (iPads / older Safari)
        run: "dotnet publish Client/Client.csproj --configuration Release --output ./dist -p:WasmEnableSIMD=false"
      
      - name: Copy Static Web App Config to wwwroot
        run: |
          if [ -f "./dist/staticwebapp.config.json" ]; then
            cp ./dist/staticwebapp.config.json ./dist/wwwroot/staticwebapp.config.json
            echo "✅ Copied staticwebapp.config.json to wwwroot"
          else
            echo "⚠️  staticwebapp.config.json not found in ./dist/"
          fi
        shell: bash
      
      - name: List published files (debug)
        run: |
          echo "Contents of ./dist/wwwroot:"
          ls -la ./dist/wwwroot
          echo ""
          echo "Checking for required files:"
          if [ -f "./dist/wwwroot/index.html" ]; then
            echo "✅ index.html found in ./dist/wwwroot/"
          else
            echo "❌ index.html NOT found in ./dist/wwwroot/"
          fi
          if [ -f "./dist/wwwroot/staticwebapp.config.json" ]; then
            echo "✅ staticwebapp.config.json found in ./dist/wwwroot/"
          else
            echo "❌ staticwebapp.config.json NOT found in ./dist/wwwroot/"
          fi
          echo ""
          echo "API will be built by Azure from source in Api/ directory"
        shell: bash
      
      - name: Setup Node.js for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json
      
      - name: Install JavaScript dependencies
        run: |
          cd Client
          npm ci
      
      - name: Run JavaScript Unit Tests
        run: |
          cd Client
          npm test -- --ci --coverage --maxWorkers=2
        continue-on-error: false
      
      - name: Upload JavaScript Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-coverage
          path: Client/coverage/
          retention-days: 30
      
      - name: Build test project (needed for Playwright)
        run: dotnet build TestProject1/TestProject1.csproj --configuration Release
      
      - name: Install Playwright Browsers
        run: pwsh TestProject1/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      
      - name: Start Static File Server for Playwright Tests
        run: |
          echo "Starting static file server for Playwright tests..."
          npm install -g serve
          serve -s ./dist/wwwroot -l 7193 --no-clipboard &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:7193 > /dev/null 2>&1; then
              echo "✅ Server is ready after ${i} seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start within 30 seconds"
              exit 1
            fi
            sleep 1
          done
        shell: bash
      
      - name: Run All Tests (excluding Manual)
        run: |
          dotnet test TestProject1/TestProject1.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --settings .runsettings \
            --filter "TestCategory!=Manual" \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
        timeout-minutes: 15
        continue-on-error: true
        id: run_tests
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:7193'
      
      - name: Show Failed Tests Summary
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Find the TRX file
          TRX_FILE=$(find ./TestResults -name "*.trx" -type f 2>/dev/null | head -1)
          
          if [ -z "$TRX_FILE" ]; then
            echo "⚠️ No TRX file found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "Processing: $TRX_FILE"
          
          # Extract test counts using sed (portable, no -P flag needed)
          TOTAL=$(sed -n 's/.*total="\([0-9]*\)".*/\1/p' "$TRX_FILE" | head -1)
          PASSED=$(sed -n 's/.*passed="\([0-9]*\)".*/\1/p' "$TRX_FILE" | head -1)
          FAILED=$(sed -n 's/.*failed="\([0-9]*\)".*/\1/p' "$TRX_FILE" | head -1)
          
          # Default to 0 if empty
          TOTAL=${TOTAL:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract failed test names using sed
          if [ "$FAILED" != "0" ] && [ "$FAILED" != "" ]; then
            echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract testName from lines containing outcome="Failed"
            grep 'outcome="Failed"' "$TRX_FILE" | sed -n 's/.*testName="\([^"]*\)".*/❌ \1/p' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Show failure messages
            echo "### 📋 Failure Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Click to expand failure messages</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract Message content from failed tests
            sed -n 's/.*<Message>\([^<]*\)<.*/\1/p' "$TRX_FILE" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash
      
      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ Tests failed - see summary above for details"
          exit 1
      
      - name: Stop Static File Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Stopping static file server (PID: $SERVER_PID)..."
            kill $SERVER_PID 2>/dev/null || true
          fi
          # Also kill any remaining serve processes
          pkill -f "serve -s" 2>/dev/null || true
        shell: bash
      
      - name: Upload .NET Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 30
      
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      
      - name: Add Coverage to Job Summary
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
            echo "✅ Added coverage summary to job summary"
          else
            echo "⚠️  code-coverage-results.md not found"
          fi
        shell: bash
      
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
      
      - name: Publish Test Results Summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/TestResults/**/*.trx
          check_name: "Test Results"
          comment_mode: off
    
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml
          retention-days: 30
      
      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            TestProject1/bin/Release/net8.0/playwright-videos/**/*
            TestProject1/bin/Release/net8.0/playwright-screenshots/**/*
            TestProject1/bin/Release/net8.0/playwright-traces/**/*
          retention-days: 30
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_COAST_0273FF81E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist/wwwroot"
          api_location: "Api"
          output_location: ""
          skip_app_build: true    # Skip building the Blazor app (already built by dotnet publish)
          skip_api_build: false   # Let Azure build the Azure Functions API from source

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-22.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_COAST_0273FF81E }}
          action: "close"
