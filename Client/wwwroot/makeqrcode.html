<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Make a QR code</title>
</head>
<body>
    <label>Enter text to be turned into QR code</label>
    <input type="text" id="myprompt" style="width:600px" value="https://calvinhsia.com" />
    <br>
    <label>Width</label>
    <input type="text" id="width" value="128" />
    <br>
    <label>Height</label>
    <input type="text" id="height" value="128" />
    <br>
    <button class="btn btn-primary" onclick="btnclick()">Generate</button>

    <script>
        function btnclick() {
            const textData = document.getElementById("myprompt").value;
            const wid = document.getElementById("width").value;
            const hei = document.getElementById("height").value;
            console.log("clicked " + textData + " " + wid);

            var qrc = document.getElementById('qrcode');
            qrc.innerHTML = '';
            const qrcode = new QRCode(qrc, {
                text: textData,
                width: Number(wid),
                height: Number(hei),
                colorDark: '#000',
                colorLight: '#fff',
                correctLevel: QRCode.CorrectLevel.H
            });

        }
    </script>

    <!--
        https://goqr.me/api/doc/read-qr-code/
        https://api.qrserver.com/v1/create-qr-code/?data=https://calvinhsia.com&size=128x128

    http://api.qrserver.com/v1/read-qr-code/?fileurl=http%3A%2F%2Fapi.qrserver.com%2Fv1%2Fcreate-qr-code%2F%3Fdata%3DHelloWorldTesting

        -->

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <br>
    <br>
    <br>

    <div id="qrcode"></div>


</body>
</html>
