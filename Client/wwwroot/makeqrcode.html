<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <label>Enter text to be turned into QR code</label>
    <input type="text" id="myprompt" style="width:600px" value="https://calvinhsia.com" />
    <button class="btn btn-primary" onclick="btnclick()">Generate</button>

    <script>
        function btnclick() {
            const textData = document.getElementById("myprompt").value;

            //            console.log("clicked "+ textData);

            var qrc = document.getElementById('qrcode');
            qrc.innerHTML = '';
            const qrcode = new QRCode(qrc, {
                text: textData,
                width: 128,
                height: 128,
                colorDark: '#000',
                colorLight: '#fff',
                correctLevel: QRCode.CorrectLevel.H
            });

        }
    </script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <br>
    <br>
    <br>

    <div id="qrcode"></div>


</body>
</html>
