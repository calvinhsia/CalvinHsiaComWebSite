<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CalvinHsia</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        Loading...
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Add this script section before the closing </body> tag -->
    <script>
        // Mobile authentication helper
        window.blazorAuthHelper = {
            isMobile: function () {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            },
            
            // Force refresh if stuck on authentication
            setupAuthTimeout: function () {
                if (window.location.pathname.includes('/authentication/') || 
                    window.location.search.includes('code=') || 
                    window.location.search.includes('state=')) {
                    console.log('Setting up auth timeout for mobile...');
                    setTimeout(function () {
                        if (window.location.pathname.includes('/authentication/login-callback') || 
                            window.location.pathname.includes('/authentication/login')) {
                            console.log('Auth timeout - redirecting to home');
                            window.location.href = '/';
                        }
                    }, 10000); // 10 second timeout
                }
            },
            
            // Clear authentication cache on mobile
            clearAuthCache: function () {
                if (this.isMobile()) {
                    localStorage.clear();
                    sessionStorage.clear();
                }
            }
        };
        
        // Auto-setup timeout on mobile devices
        if (window.blazorAuthHelper.isMobile()) {
            window.blazorAuthHelper.setupAuthTimeout();
        }
    </script>
</body>

</html>
