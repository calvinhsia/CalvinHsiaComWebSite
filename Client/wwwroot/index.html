<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Development cache busting - enable for development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>CalvinHsia</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/wordscape-game.css" rel="stylesheet" />
    <link href="css/wordament-game.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        Loading...
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    
    <!-- Load common JavaScript BEFORE Blazor framework to ensure gameStateManager is available -->
    <script src="js/common.js"></script>
    <script src="js/wordscape-game.js"></script>
    <script src="js/wordament-game.js"></script>
    
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Mobile-friendly CSS overrides for both games -->
    <script>
        window.addEventListener('load', function () {
            // Add mobile-friendly CSS overrides for game visibility
            const style = document.createElement('style');
            style.id = 'mobile-game-visibility-override';
            style.textContent = `
                /* Critical visibility overrides for mobile-friendly games */
                .narrow-layout-controls,
                .narrow-circle-container,
                .letter-wheel,
                .letter-wheel svg,
                .draggable-wheel-container .corner,
                .wordament-grid,
                .wordament-cell {
                    display: block !important;
                    visibility: visible !important;
                    opacity: 1 !important;
                }

                /* WORDAMENT GRID FIX - Ensure 4x4 grid layout is maintained */
                .wordament-grid {
                    display: grid !important;
                    grid-template-columns: repeat(4, 1fr) !important;
                    grid-template-rows: repeat(4, 1fr) !important;
                    grid-gap: 4px !important;
                    gap: 4px !important;
                    width: min(400px, 90vw) !important;
                    height: min(400px, 90vw) !important;
                    max-width: 400px !important;
                    max-height: 400px !important;
                }

                .wordament-cell {
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    min-height: 70px !important;
                    width: auto !important;
                    height: auto !important;
                    flex-direction: row !important;  /* Ensure not column */
                    flex-wrap: nowrap !important;
                }

                .narrow-layout-controls {
                    min-width: 280px !important;
                    min-height: 280px !important;
                    position: relative !important;
                    width: 100% !important;
                    max-width: 95vw !important;
                }

                .narrow-circle-container {
                    min-width: 250px !important;
                    min-height: 250px !important;
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    position: relative !important;
                    margin: 0 auto !important;
                }

                .letter-wheel svg {
                    min-width: 220px !important;
                    min-height: 220px !important;
                    margin: 0 auto !important;
                    max-width: 85vw !important;
                    max-height: 85vw !important;
                }

                .draggable-wheel-container .corner {
                    position: absolute !important;
                    z-index: 35 !important;
                    pointer-events: auto !important;
                    touch-action: auto !important;
                    cursor: default !important;
                }

                .center-shuffle-button {
                    display: flex !important;
                    visibility: visible !important;
                    opacity: 1 !important;
                    position: absolute !important;
                    top: 50% !important;
                    left: 50% !important;
                    transform: translate(-50%, -50%) !important;
                    z-index: 30 !important;
                    width: 40px !important;
                    height: 40px !important;
                    font-size: 18px !important;
                    pointer-events: auto !important;
                    touch-action: manipulation !important;
                }

                /* Android-specific grid positioning fixes - make grid flush like current-word-bar */
                ${/Android/i.test(navigator.userAgent) ? `
                /* Android-specific grid positioning - MIMIC current-word-bar behavior */
                .game-content {
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                    margin-left: 0 !important;
                    margin-right: 0 !important;
                }

                .wordscape-fixed-game {
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                    margin-left: 0 !important;
                    margin-right: 0 !important;
                    width: 100vw !important;
                    max-width: 100vw !important;
                }

                .game-grid {
                    /* Make grid behave exactly like current-word-bar */
                    display: flex !important;
                    justify-content: center !important;
                    align-items: center !important;
                    width: 100% !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    /* Remove transform positioning - let flexbox handle centering */
                    position: static !important;
                    left: auto !important;
                    transform: none !important;
                }

                .grid-container {
                    /* Make grid-container behave like current-word-display */
                    margin: 0 !important;
                    padding: 1px !important;
                    max-width: none !important;
                    width: fit-content !important;
                    position: static !important;
                    left: auto !important;
                    transform: none !important;
                }

                /* Remove Bootstrap px-4 padding that causes left whitespace */
                .px-4 {
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                }

                article.content {
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                }
                ` : ''}

                /* Mobile-specific overrides */
                @media (max-width: 768px) {
                    .wordscape-container {
                        padding: 5px !important;
                    }

                    /* Wordament mobile grid adjustments */
                    .wordament-grid {
                        width: min(350px, 95vw) !important;
                        height: min(350px, 95vw) !important;
                        display: grid !important;
                        grid-template-columns: repeat(4, 1fr) !important;
                        grid-template-rows: repeat(4, 1fr) !important;
                    }

                    .wordament-cell {
                        min-height: 60px !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }

                    .draggable-wheel-container {
                        min-width: min(95vw, 300px) !important;
                        min-height: min(95vw, 300px) !important;
                        width: min(95vw, 300px) !important;
                        height: min(95vw, 300px) !important;
                        padding: 25px !important;
                        display: block !important;
                        visibility: visible !important;
                        opacity: 1 !important;
                        overflow: visible !important;
                    }

                    .letter-wheel svg {
                        min-width: 180px !important;
                        min-height: 180px !important;
                    }

                    .draggable-wheel-container .corner {
                        padding: 3px 6px !important;
                        min-width: 50px !important;
                        font-size: 11px !important;
                    }

                    .draggable-wheel-container .corner-value {
                        font-size: 13px !important;
                    }

                    .draggable-wheel-container .corner-label {
                        font-size: 7px !important;
                    }

                    /* Android grid positioning for mobile screens */
                    ${/Android/i.test(navigator.userAgent) ? `
                    .game-content {
                        padding-left: 1px !important;
                        padding-right: 1px !important;
                    }

                    .wordscape-fixed-game {
                        padding-left: 2px !important;
                        padding-right: 2px !important;
                    }
                    ` : ''}
                }

                @media (max-width: 480px) {
                    /* Wordament small mobile grid adjustments */
                    .wordament-grid {
                        width: min(300px, 95vw) !important;
                        height: min(300px, 95vw) !important;
                        display: grid !important;
                        grid-template-columns: repeat(4, 1fr) !important;
                        grid-template-rows: repeat(4, 1fr) !important;
                        gap: 3px !important;
                    }

                    .wordament-cell {
                        min-height: 50px !important;
                        font-size: 1.3rem !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }
                }

                @media (max-width: 400px) {
                    .draggable-wheel-container {
                        min-width: min(98vw, 280px) !important;
                        min-height: min(98vw, 280px) !important;
                        width: min(98vw, 280px) !important;
                        height: min(98vw, 280px) !important;
                        padding: 20px !important;
                    }

                    .letter-wheel svg {
                        width: 200px !important;
                        height: 200px !important;
                        min-width: 180px !important;
                        min-height: 180px !important;
                    }

                    .draggable-wheel-container .corner {
                        padding: 2px 5px !important;
                        min-width: 45px !important;
                        font-size: 10px !important;
                    }

                    .draggable-wheel-container .corner-value {
                        font-size: 12px !important;
                    }

                    .draggable-wheel-container .corner-label {
                        font-size: 6px !important;
                    }

                    .center-shuffle-button {
                        width: 35px !important;
                        height: 35px !important;
                        font-size: 16px !important;
                    }
                }

                @media (max-width: 320px) {
                    .draggable-wheel-container {
                        min-width: 300px !important;
                        min-height: 300px !important;
                        width: 300px !important;
                        height: 300px !important;
                        padding: 15px !important;
                    }

                    .letter-wheel svg {
                        width: 200px !important;
                        height: 200px !important;
                        min-width: 180px !important;
                        min-height: 180px !important;
                    }

                    .draggable-wheel-container .corner {
                        padding: 2px 4px !important;
                        min-width: 40px !important;
                        font-size: 9px !important;
                    }

                    .draggable-wheel-container .corner-value {
                        font-size: 11px !important;
                    }

                    .draggable-wheel-container .corner-label {
                        font-size: 6px !important;
                    }

                    .center-shuffle-button {
                        width: 30px !important;
                        height: 30px !important;
                        font-size: 14px !important;
                    }
                }

                /* Ensure draggable container is mobile-friendly */
                .draggable-wheel-container {
                    display: block !important;
                    visibility: visible !important;
                    opacity: 1 !important;
                    background: rgba(255, 255, 0, 0.08) !important;
                    border: 3px dashed rgba(255, 255, 0, 0.4) !important;
                    border-radius: 25px !important;
                    min-width: 320px !important;
                    min-height: 320px !important;
                    max-width: 95vw !important;
                    width: min(95vw, 400px) !important;
                    height: min(95vw, 400px) !important;
                    padding: 30px !important;
                    touch-action: none !important;
                    cursor: grab !important;
                    position: relative !important;
                    overflow: visible !important;
                    box-sizing: border-box !important;
                }

                .draggable-wheel-container:active {
                    cursor: grabbing !important;
                }

                /* Ensure corner controls are positioned at very edges */
                .draggable-wheel-container .corner-topleft {
                    top: 0px !important;
                    left: 0px !important;
                }

                .draggable-wheel-container .corner-topright {
                    top: 0px !important;
                    right: 0px !important;
                }

                .draggable-wheel-container .corner-bottomleft {
                    bottom: 0px !important;
                    left: 0px !important;
                }

                .draggable-wheel-container .corner-bottomright {
                    bottom: 0px !important;
                    right: 0px !important;
                }
            `;

            if (!document.head.querySelector('#mobile-game-visibility-override')) {
                document.head.appendChild(style);
                console.log('✅ Mobile-friendly game visibility override styles injected');
            }
        });
    </script>
</body>

</html>
