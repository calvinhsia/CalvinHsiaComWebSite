    <!-- Application Insights JavaScript SDK - v3 SIMPLIFIED -->
    <script type="text/javascript">
        console.log('[AppInsights v3] Starting initialization...');

        // Create a simple stub first to prevent "not defined" errors
        window.appInsights = {
            _isStub: true,
            trackEvent: function () { },
            trackTrace: function () { },
            trackException: function () { },
            trackPageView: function () { },
            trackMetric: function () { },
            flush: function () { console.log('[AppInsights v3] Stub flush called - SDK not yet loaded'); },
            queue: []
        };

        console.log('✅ [AppInsights v3] Stub created - SDK will load asynchronously');

        // Load the full SDK asynchronously
        (function () {
            var sdkLoadStartTime = performance.now();
            var aiScript = document.createElement('script');
            aiScript.src = 'js/applicationinsights-web.min.js?v=1'; // Load from local bundle instead of blocked CDN
            aiScript.async = true;

            aiScript.onload = function () {
                var loadTime = performance.now() - sdkLoadStartTime;
                console.log(`✅ [AppInsights v3] SDK loaded from local bundle in ${loadTime.toFixed(0)}ms`);

                // Check SDK load timing for detection debugging
                var startTime = performance.now();

                // Initialize with connection string after SDK loads
                var connectionString = "InstrumentationKey=9fa4f886-5da4-48d9-ab3b-a2f82bddc5ae;IngestionEndpoint=https://westus2-2.in.applicationinsights.azure.com/;LiveEndpoint=https://westus2.livediagnostics.monitor.azure.com/;ApplicationId=11c467be-c34b-4158-a2ff-1308c196bd54";

                try {
                    window.appInsights = new Microsoft.ApplicationInsights.ApplicationInsights({
                        config: {
                            connectionString: connectionString
                        }
                    });
                    window.appInsights.loadAppInsights();
                    window.appInsights.trackPageView();

                    var endTime = performance.now();
                    console.log(`✅ [AppInsights v3] SDK initialized and ready (took ${(endTime - startTime).toFixed(1)}ms)`);
                    console.log(`✅ [AppInsights v3] SDK fully ready after ${Math.round(endTime)}ms from page start`);
                } catch (ex) {
                    console.error(`❌ [AppInsights v3] SDK initialization failed:`, ex);
                    // Keep stub in place
                }
            };

            aiScript.onerror = function (error) {
                var loadTime = performance.now() - sdkLoadStartTime;
                console.error(`❌ [AppInsights v3] Failed to load SDK from local bundle after ${loadTime.toFixed(0)}ms`);
                console.error(`❌ [AppInsights v3] Error details:`, error);
                console.error(`❌ [AppInsights v3] Script URL:`, aiScript.src);
                console.warn('⚠️ [AppInsights v3] Telemetry will not be sent - using stub only');
            };

            // Timeout detection - if SDK doesn't load in 10 seconds, something is wrong
            setTimeout(function () {
                if (window.appInsights && window.appInsights._isStub) {
                    console.error(`❌ [AppInsights v3] SDK failed to load within 10 seconds - possible file missing or blocked`);
                    console.error(`❌ [AppInsights v3] Check network tab for failed request to: ${aiScript.src}`);
                }
            }, 10000);

            document.head.appendChild(aiScript);
            console.log(`⏳ [AppInsights v3] Loading SDK from local bundle: ${aiScript.src}`);
        })();
    </script>

    <!-- Global error capture for debugging -->
    <script>
        // Mobile landscape detection: sets body class for CSS targeting
        function updateMobileLandscape() {
            var isLandscape = window.screen.orientation
                ? window.screen.orientation.type.startsWith('landscape')
                : window.innerWidth > window.innerHeight;
            var isTouch = navigator.maxTouchPoints > 0;
            var isNarrowDevice = window.screen.width <= 900 || window.screen.height <= 900;
            if (isLandscape && isTouch && isNarrowDevice) {
                document.body.classList.add('mobile-landscape');
            } else {
                document.body.classList.remove('mobile-landscape');
            }
        }
        window.addEventListener('orientationchange', updateMobileLandscape);
        window.addEventListener('resize', updateMobileLandscape);
        updateMobileLandscape();

        // Capture all errors and display them on screen for debugging
        var errorLog = [];

        window.onerror = function (message, source, lineno, colno, error) {
            console.error('[Global Error]', message, source, lineno, colno, error);
            errorLog.push({ type: 'error', message: message, source: source, line: lineno, col: colno, stack: error ? error.stack : null, time: new Date().toISOString() });
            updateErrorDisplay();
            return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
            console.error('[Unhandled Promise Rejection]', event.reason);
            errorLog.push({ type: 'promise', reason: event.reason ? (event.reason.message || String(event.reason)) : 'Unknown', stack: event.reason && event.reason.stack ? event.reason.stack : null, time: new Date().toISOString() });
            updateErrorDisplay();
        });

        function updateErrorDisplay() {
            var details = document.getElementById('error-details');
            if (details && errorLog.length > 0) {
                var text = 'Errors captured (' + errorLog.length + '):\n\n';
                errorLog.forEach(function (e, i) {
                    text += '--- Error ' + (i + 1) + ' [' + e.time + '] ---\n';
                    if (e.type === 'error') {
                        text += 'Message: ' + e.message + '\n';
                        text += 'Source: ' + e.source + '\n';
                        text += 'Line: ' + e.line + ':' + e.col + '\n';
                    } else {
                        text += 'Promise Rejection: ' + e.reason + '\n';
                    }
                    if (e.stack) {
                        text += 'Stack:\n' + e.stack + '\n';
                    }
                    text += '\n';
                });
                details.textContent = text;
            }
            var errorUI = document.getElementById('blazor-error-ui');
            if (errorUI) {
                errorUI.style.display = 'block';
            }
        }

        console.log('[Debug] Enhanced error handlers installed');
    </script>

    <!-- Enhanced loading and error handling for Edge/Firefox -->
    <script>
        // Enhanced loading indicator
        let loadingStage = 0;
        const loadingStages = [
            "⚡ Initializing",
            "📦 Loading Framework",
            "🔧 Starting Services",
            "🎮 Preparing Pages",
            "✨ Almost Ready"
        ];

        // Update loading text periodically
        const loadingInterval = setInterval(() => {
            const loadingElement = document.getElementById('loading-dots');
            if (loadingElement && loadingStage < loadingStages.length - 1) {
                loadingStage++;
                loadingElement.textContent = loadingStages[loadingStage];
            }
        }, 800);

        // Clear loading interval when Blazor starts
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => {
                if (loadingInterval) {
                    clearInterval(loadingInterval);
                    const loadingElement = document.getElementById('loading-dots');
                    if (loadingElement) {
                        loadingElement.textContent = "🚀 Ready!";
                    }
                }
            }, 4000);
        });

        // Better error handling for Blazor startup
        // On dev cold-start, the server may not be ready when the browser launches.
        // Auto-reload ONCE if Blazor hasn't started within 6s (prevents hang on first cold start).
        // Uses sessionStorage to ensure we only reload once per browser session, not in a loop.
        var blazorStarted = false;
        var hasAutoReloaded = sessionStorage.getItem('blazorAutoReloaded') === '1';
        window.blazorStartupTimeout = setTimeout(() => {
            if (blazorStarted) return;
            const appElement = document.getElementById('app');
            if (appElement && appElement.innerHTML.includes('Loading')) {
                if (!hasAutoReloaded) {
                    console.warn('⚠️ Blazor not started after 6s — auto-reloading once...');
                    sessionStorage.setItem('blazorAutoReloaded', '1');
                    location.reload();
                } else {
                    console.warn('⚠️ Blazor still not started after reload — server may be slow, please wait or reload manually.');
                    sessionStorage.removeItem('blazorAutoReloaded'); // reset for next F5
                }
            }
        }, 6000);

        // Clear timeout when Blazor starts
        window.addEventListener('blazor-started', () => {
            blazorStarted = true;
            sessionStorage.removeItem('blazorAutoReloaded'); // reset flag on successful start
            if (window.blazorStartupTimeout) {
                clearTimeout(window.blazorStartupTimeout);
            }
        });
    </script>

    <!-- Audio spectrum canvas helper -->
    <script>
        window.audioGameDrawSpectrum = function (data, sampleRate) {
            var canvas = document.getElementById('audioSpectrumCanvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, W, H);
            var len = data.length;
            var barW = W / len;
            for (var i = 0; i < len; i++) {
                var db = data[i]; // typically -160..0
                var norm = Math.max(0, (db + 160) / 160); // 0..1
                var barH = norm * H;
                var hue = Math.round((1 - norm) * 240); // blue=cold, red=loud
                ctx.fillStyle = 'hsl(' + hue + ',100%,50%)';
                ctx.fillRect(i * barW, H - barH, Math.max(1, barW - 0.5), barH);
            }
            // frequency axis labels
            ctx.fillStyle = '#aaa';
            ctx.font = '10px monospace';
            [500, 1000, 2000, 4000, 8000].forEach(function (f) {
                if (f < sampleRate / 2) {
                    var x = Math.round((f / (sampleRate / 2)) * W);
                    ctx.fillText(f >= 1000 ? (f / 1000) + 'k' : f, x + 2, H - 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.fillRect(x, 0, 1, H);
                    ctx.fillStyle = '#aaa';
                }
            });
        };
    </script>

    <!-- Enhanced Blazor startup for better Edge/Firefox support -->
    <script>
        // Wait for Blazor to be available (handles async script loading race condition)
        function waitForBlazor(callback, maxAttempts = 50) {
            let attempts = 0;
            const checkBlazor = () => {
                attempts++;
                if (typeof Blazor !== 'undefined') {
                    callback();
                } else if (attempts < maxAttempts) {
                    setTimeout(checkBlazor, 100);
                } else {
                    console.error('❌ Blazor failed to load after ' + maxAttempts + ' attempts');
                    const errorUI = document.getElementById('blazor-error-ui');
                    if (errorUI) errorUI.style.display = 'block';
                }
            };
            checkBlazor();
        }

        // Configure Blazor for better Edge/Firefox compatibility
        waitForBlazor(function () {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // Add loading progress updates
                    if (type === 'dotnetjs') {
                        console.log('🔧 Loading .NET runtime...');
                        const loadingText = document.getElementById('loading-text');
                        if (loadingText) loadingText.textContent = 'Loading .NET Runtime...';
                    } else if (type === 'dotnetwasm') {
                        console.log('📦 Loading WebAssembly...');
                        const loadingText = document.getElementById('loading-text');
                        if (loadingText) loadingText.textContent = 'Loading WebAssembly...';
                    }

                    // Return the default URI to continue with default loading behavior
                    return defaultUri;
                }
            }).then(() => {
                console.log('✅ Blazor WebAssembly started successfully');
                window.dispatchEvent(new Event('blazor-started'));

                // Clear loading indicators
                if (loadingInterval) clearInterval(loadingInterval);
                if (window.blazorStartupTimeout) clearTimeout(window.blazorStartupTimeout);
            }).catch(error => {
                console.error('❌ Blazor startup failed:', error);

                // Show enhanced error UI
                const errorUI = document.getElementById('blazor-error-ui');
                if (errorUI) {
                    errorUI.style.display = 'block';
                }

                // Clear loading indicators
                if (loadingInterval) clearInterval(loadingInterval);
                if (window.blazorStartupTimeout) clearTimeout(window.blazorStartupTimeout);
            });
        });
    </script>

    <!-- Service Worker Registration for PWA -->
    <script>
        // Dynamically load service worker based on configuration
        fetch('appsettings.json')
            .then(response => response.json())
            .then(config => {
                const swEnabled = config?.ServiceWorker?.Enabled ?? true; // Default to enabled

                if (swEnabled && 'serviceWorker' in navigator) {
                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('/sw.js')
                            .then(function (registration) {
                                console.log('✅ Service Worker registered:', registration.scope);
                            })
                            .catch(function (error) {
                                console.log('❌ Service Worker registration failed:', error);
                            });
                    });
                    console.log('✅ Service Worker enabled (production mode)');
                } else if ('serviceWorker' in navigator) {
                    // Development mode: unregister any existing service workers so stale
                    // SW from a previous production session doesn't intercept requests.
                    navigator.serviceWorker.getRegistrations().then(function (registrations) {
                        if (registrations.length > 0) {
                            console.warn(`⚠️ Unregistering ${registrations.length} service worker(s) in development mode`);
                            registrations.forEach(r => r.unregister());
                            // Reload once to get a clean session without the SW intercepting
                            if (!sessionStorage.getItem('swUnregistered')) {
                                sessionStorage.setItem('swUnregistered', '1');
                                location.reload();
                            }
                        } else {
                            sessionStorage.removeItem('swUnregistered');
                        }
                    });
                    console.log('⚠️ Service Worker disabled (development mode) — unregistering any existing SW');
                }
            })
            .catch(error => {
                console.warn('⚠️ Could not load appsettings.json, Service Worker disabled:', error);
            });
    </script>

    <script>
        // Returns the MSAL ID token (a proper JWT with oid claim) for use in API auth.
        // The Graph access token for MSA accounts is an opaque token, not a JWT, so
        // it cannot be cryptographically validated server-side. The ID token is always
        // a signed JWT and contains the oid claim we need.
        window.getMsalIdToken = function () {
            try {
                // MSAL stores tokens in localStorage under keys matching the pattern:
                //   <clientId>.<tenantId>-login.windows.net-idtoken-<clientId>-<tenantId>--
                // We scan all localStorage keys for one that contains 'idtoken' and looks like a JWT.
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.toLowerCase().includes('idtoken')) {
                        var raw = localStorage.getItem(key);
                        if (!raw) continue;
                        try {
                            var entry = JSON.parse(raw);
                            var secret = entry.secret || entry.credential || entry.value;
                            // A JWT has exactly 3 dot-separated parts
                            if (secret && secret.split('.').length === 3) {
                                console.log('[getMsalIdToken] Found ID token via key: ' + key);
                                return secret;
                            }
                        } catch (e) {
                            // raw might already be the token string, not JSON
                            if (raw.split('.').length === 3) {
                                console.log('[getMsalIdToken] Found ID token (raw) via key: ' + key);
                                return raw;
                            }
                        }
                    }
                }
                console.warn('[getMsalIdToken] No ID token found in localStorage');
                return null;
            } catch (e) {
                console.error('[getMsalIdToken] Error: ' + e.message);
                return null;
            }
        };
    </script>
