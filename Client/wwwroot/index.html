    <div id="blazor-error-ui" style="display: none;">

            <h4>Application Error</h4>
            <p>An unhandled error has occurred. This can happen if the Blazor WebAssembly app is still loading.</p>
            <div style="margin-top: 1rem;">
                <button onclick="location.reload()" style="background: #dc3545; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; cursor: pointer; margin-right: 0.5rem;">🔄 Reload</button>
                <button onclick="document.getElementById('blazor-error-ui').style.display='none'" style="background: #6c757d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; cursor: pointer;">✕ Dismiss</button>
            </div>
        </div>
    </div>
    
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    
    <!-- Enhanced loading and error handling for Edge/Firefox -->
    <script>
        // Enhanced loading indicator
        let loadingStage = 0;
        const loadingStages = [
            "⚡ Initializing",
            "📦 Loading Framework", 
            "🔧 Starting Services",
            "🎮 Preparing Games",
            "✨ Almost Ready"
        ];

        // Update loading text periodically
        const loadingInterval = setInterval(() => {
            const loadingElement = document.getElementById('loading-dots');
            if (loadingElement && loadingStage < loadingStages.length - 1) {
                loadingStage++;
                loadingElement.textContent = loadingStages[loadingStage];
            }
        }, 800);

        // Clear loading interval when Blazor starts
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                if (loadingInterval) {
                    clearInterval(loadingInterval);
                    const loadingElement = document.getElementById('loading-dots');
                    if (loadingElement) {
                        loadingElement.textContent = "🚀 Ready!";
                    }
                }
            }, 4000);
        });

        // Better error handling for Blazor startup
        window.blazorStartupTimeout = setTimeout(() => {
            const appElement = document.getElementById('app');
            if (appElement && appElement.innerHTML.includes('Loading')) {
                console.warn('⚠️ Blazor startup taking longer than expected');
                const loadingText = document.getElementById('loading-text');
                if (loadingText) {
                    loadingText.innerHTML = 'Loading is taking longer than usual...<br><small>This is normal for the first load in Edge/Firefox</small>';
                }
                
                // Show retry option after extended delay
                setTimeout(() => {
                    if (appElement && appElement.innerHTML.includes('Loading')) {
                        const loadingText = document.getElementById('loading-text');
                        if (loadingText) {
                            loadingText.innerHTML = `
                                <div>Taking too long to load?</div>
                                <button onclick="location.reload()" style="
                                    background: #007bff; 
                                    color: white; 
                                    border: none; 
                                    padding: 0.5rem 1rem; 
                                    border-radius: 0.25rem; 
                                    cursor: pointer; 
                                    margin-top: 0.5rem;
                                ">🔄 Reload Page</button>
                            `;
                        }
                    }
                }, 5000);
            }
        }, 8000);

        // Clear timeout when Blazor starts
        window.addEventListener('blazor-started', () => {
            if (window.blazorStartupTimeout) {
                clearTimeout(window.blazorStartupTimeout);
            }
        });
    </script>

    <!-- Enhanced Blazor startup for better Edge/Firefox support -->
    <script>
        // Configure Blazor for better Edge/Firefox compatibility
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // Add loading progress updates
                if (type === 'dotnetjs') {
                    console.log('🔧 Loading .NET runtime...');
                    const loadingText = document.getElementById('loading-text');
                    if (loadingText) loadingText.textContent = 'Loading .NET Runtime...';
                } else if (type === 'dotnetwasm') {
                    console.log('📦 Loading WebAssembly...');
                    const loadingText = document.getElementById('loading-text');
                    if (loadingText) loadingText.textContent = 'Loading WebAssembly...';
                }
                
                // Return the default URI to continue with default loading behavior
                return defaultUri;
            }
        }).then(() => {
            console.log('✅ Blazor WebAssembly started successfully');
            window.dispatchEvent(new Event('blazor-started'));
            
            // Clear loading indicators
            if (loadingInterval) clearInterval(loadingInterval);
            if (window.blazorStartupTimeout) clearTimeout(window.blazorStartupTimeout);
        }).catch(error => {
            console.error('❌ Blazor startup failed:', error);
            
            // Show enhanced error UI
            const errorUI = document.getElementById('blazor-error-ui');
            if (errorUI) {
                errorUI.style.display = 'block';
            }
            
            // Clear loading indicators
            if (loadingInterval) clearInterval(loadingInterval);
            if (window.blazorStartupTimeout) clearTimeout(window.blazorStartupTimeout);
        });
    </script>

    <!-- Service Worker and other scripts remain the same... -->
    <script>
        // Store the install prompt event
        let deferredPrompt;
        let installButton;

        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker registered successfully:', registration.scope);
                        
                        // Listen for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    console.log('🔄 New version available!');
                                    showUpdateNotification();
                                }
                            });
                        });
                    })
                    .catch(function(error) {
                        console.log('❌ Service Worker registration failed:', error);
                    });
                
                // Listen for messages from service worker
                navigator.serviceWorker.addEventListener('message', event => {
                    if (event.data.type === 'UPDATE_AVAILABLE') {
                        console.log('📱 ' + event.data.message);
                        showUpdateNotification();
                    }
                });
            });
        }

        // Listen for the beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('📱 PWA install prompt available');
            
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            
            // Store the event so it can be triggered later
            deferredPrompt = e;
            
            // Show custom install button after user has played for a bit
            setTimeout(() => {
                showCustomInstallPrompt();
            }, 30000); // Show after 30 seconds of engagement
        });

        // Show custom install prompt
        function showCustomInstallPrompt() {
            if (!deferredPrompt) return;

            // Check if user is on mobile and engaged with the game
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches;
            
            // Don't show if already installed or not mobile
            if (isInStandaloneMode || !isMobile) return;

            // Create custom install prompt
            const installPrompt = document.createElement('div');
            installPrompt.id = 'custom-install-prompt';
            installPrompt.innerHTML = `
                <div style="
                    position: fixed;
                    bottom: 20px;
                    left: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #007bff, #0056b3);
                    color: white;
                    padding: 16px;
                    border-radius: 12px;
                    box-shadow: 0 4px 20px rgba(0,123,255,0.3);
                    z-index: 10000;
                    text-align: center;
                    animation: slideUp 0.3s ease-out;
                ">
                    <div style="margin-bottom: 12px;">
                        <strong>🎮 Install WordScape</strong>
                    </div>
                    <div style="font-size: 14px; margin-bottom: 12px; opacity: 0.9;">
                        Add to your home screen for a better gaming experience!
                    </div>
                    <div>
                        <button onclick="installPWA()" style="
                            background: white;
                            color: #007bff;
                            border: none;
                            padding: 8px 16px;
                            border-radius: 6px;
                            margin-right: 10px;
                            font-weight: bold;
                            cursor: pointer;
                        ">Install App</button>
                        <button onclick="dismissInstallPrompt()" style="
                            background: transparent;
                            color: white;
                            border: 1px solid rgba(255,255,255,0.5);
                            padding: 8px 16px;
                            border-radius: 6px;
                            cursor: pointer;
                        ">Maybe Later</button>
                    </div>
                </div>
                <style>
                    @keyframes slideUp {
                        from { transform: translateY(100%); opacity: 0; }
                        to { transform: translateY(0); opacity: 1; }
                    }
                </style>
            `;
            
            document.body.appendChild(installPrompt);
        }

        // Install PWA when user clicks install
        async function installPWA() {
            if (!deferredPrompt) return;

            // Show the install prompt
            deferredPrompt.prompt();
            
            // Wait for the user to respond to the prompt
            const { outcome } = await deferredPrompt.userChoice;
            
            console.log(`👤 User response to install prompt: ${outcome}`);
            
            if (outcome === 'accepted') {
                console.log('🎉 User accepted the install prompt');
            } else {
                console.log('😔 User dismissed the install prompt');
            }
            
            // Clear the deferred prompt
            deferredPrompt = null;
            
            // Remove the custom prompt
            document.getElementById('custom-install-prompt')?.remove();
        }

        // Dismiss install prompt
        function dismissInstallPrompt() {
            document.getElementById('custom-install-prompt')?.remove();
            deferredPrompt = null;
            
            // Don't show again for this session
            sessionStorage.setItem('installPromptDismissed', 'true');
        }

        // Check if app was successfully installed
        window.addEventListener('appinstalled', (evt) => {
            console.log('🎉 WordScape PWA was installed successfully!');
            
            // Optional: Track this event for analytics
            // analytics.track('PWA Installed');
            
            // Remove any lingering install prompts
            document.getElementById('custom-install-prompt')?.remove();
        });

        // Show update notification to user
        function showUpdateNotification() {
            // Create update notification
            const updateBanner = document.createElement('div');
            updateBanner.id = 'pwa-update-banner';
            updateBanner.innerHTML = `
                <div style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    background: #28a745;
                    color: white;
                    padding: 12px;
                    text-align: center;
                    font-size: 14px;
                    z-index: 10001;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                ">
                    <div style="margin-bottom: 8px;">
                        <strong>🎉 Update Available!</strong>
                    </div>
                    <div style="font-size: 12px; margin-bottom: 8px;">
                        A new version of WordScape is ready to install.
                    </div>
                    <button onclick="updatePWA()" style="
                        background: white;
                        color: #28a745;
                        border: none;
                        padding: 6px 12px;
                        border-radius: 4px;
                        margin-right: 10px;
                        font-weight: bold;
                        cursor: pointer;
                    ">Update Now</button>
                    <button onclick="dismissUpdate()" style="
                        background: transparent;
                        color: white;
                        border: 1px solid white;
                        padding: 6px 12px;
                        border-radius: 4px;
                        cursor: pointer;
                    ">Later</button>
                </div>
            `;
            
            document.body.appendChild(updateBanner);
        }

        // Update PWA when user clicks update
        function updatePWA() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (registration && registration.waiting) {
                        // Tell the waiting service worker to activate
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                        
                        // Reload the page after a short delay
                        setTimeout(() => {
                            window.location.reload();
                        }, 1000);
                    }
                });
            }
            
            document.getElementById('pwa-update-banner')?.remove();
        }

        // Dismiss update notification
        function dismissUpdate() {
            document.getElementById('pwa-update-banner')?.remove();
        }
    </script>

                .draggable-wheel-container .corner-bottomleft {

            if (!document.head.querySelector('#mobile-game-visibility-override')) {
