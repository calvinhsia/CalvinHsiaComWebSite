    <!-- WordScape Game JavaScript Functions -->
    <script>
        // Function to convert client coordinates to SVG coordinates
        window.convertClientToSVGCoordinates = function (svgElementRef, clientX, clientY) {
            try {
                console.log('convertClientToSVGCoordinates called with:', clientX, clientY);
                
                // Get the actual DOM element from Blazor's ElementReference
                var svgElement = svgElementRef;
                
                // If it's a Blazor ElementReference, we need to get the actual DOM element
                if (svgElement && typeof svgElement === 'object' && svgElement.tagName !== 'svg') {
                    // This might be a Blazor ElementReference wrapper, try to find the actual SVG
                    if (svgElement.querySelector) {
                        svgElement = svgElement.querySelector('svg');
                    } else {
                        console.error('Cannot find SVG element from ElementReference');
                        return [0, 0];
                    }
                }
                
                if (!svgElement || svgElement.tagName !== 'svg') {
                    console.error('SVG element is null or not an SVG element');
                    return [0, 0];
                }
                
                console.log('Working with SVG element:', svgElement);
                
                var rect = svgElement.getBoundingClientRect();
                console.log('SVG rect:', rect);
                
                if (rect.width === 0 || rect.height === 0) {
                    console.error('SVG element has zero width or height');
                    return [0, 0];
                }
                
                // Get the viewBox - handle both cases where viewBox might be set differently
                var viewBoxWidth, viewBoxHeight;
                
                try {
                    var viewBox = svgElement.viewBox.baseVal;
                    if (viewBox && viewBox.width > 0 && viewBox.height > 0) {
                        viewBoxWidth = viewBox.width;
                        viewBoxHeight = viewBox.height;
                        console.log('Using viewBox.baseVal:', viewBoxWidth, 'x', viewBoxHeight);
                    } else {
                        throw new Error('viewBox.baseVal not available or zero');
                    }
                } catch (e) {
                    console.log('viewBox.baseVal failed, trying getAttribute:', e.message);
                    // Fallback: parse viewBox attribute directly
                    var viewBoxAttr = svgElement.getAttribute('viewBox');
                    if (viewBoxAttr) {
                        var viewBoxValues = viewBoxAttr.split(/\s+/);
                        if (viewBoxValues.length >= 4) {
                            viewBoxWidth = parseFloat(viewBoxValues[2]);
                            viewBoxHeight = parseFloat(viewBoxValues[3]);
                            console.log('Using viewBox attribute:', viewBoxWidth, 'x', viewBoxHeight);
                        }
                    }
                    
                    // Final fallback: use SVG width/height attributes
                    if (!viewBoxWidth || !viewBoxHeight) {
                        viewBoxWidth = parseFloat(svgElement.getAttribute('width')) || 280;
                        viewBoxHeight = parseFloat(svgElement.getAttribute('height')) || 280;
                        console.log('Using SVG width/height attributes:', viewBoxWidth, 'x', viewBoxHeight);
                    }
                }
                
                // Convert client coordinates to SVG coordinates
                var svgX = (clientX - rect.left) * (viewBoxWidth / rect.width);
                var svgY = (clientY - rect.top) * (viewBoxHeight / rect.height);
                
                console.log('Converted coordinates:', svgX, svgY);
                
                return [svgX, svgY];
            } catch (e) {
                console.error('Error converting coordinates:', e);
                return [0, 0];
            }
        };
        
        // Function to open URLs in a new tab
        window.openUrl = function (url) {
            window.open(url, '_blank');
        };
    </script>
    
    <!-- Enhanced authentication helper -->
    <script>
        // Enhanced authentication helper
        window.blazorAuthHelper = {
            isMobile: function () {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            },
            
            setupAuthTimeout: function () {
                if (this.isMobile()) {
                    // Increase timeout for mobile and check auth state first
                    setTimeout(function () {
                        if (window.location.pathname.includes('/authentication/login-callback')) {
                            console.log('Auth callback timeout - checking if user is actually authenticated');
                            // Instead of immediately redirecting, trigger the auth check
                            if (window.DotNet) {
                                console.log('Triggering auth status check from timeout');
                                // This will be handled by the CheckAuthAndRedirect method
                            } else {
                                console.log('DotNet not available, redirecting to home');
                                window.location.href = '/';
                            }
                        }
                    }, 15000); // Increase to 15 seconds
                }
            },
            
            // Clear authentication cache
            clearAuthCache: function () {
                try {
                    console.log('Clearing authentication cache...');
                    
                    // Clear MSAL specific items
                    Object.keys(localStorage).forEach(key => {
                        if (key includes('msal') || key.includes('auth') || key.includes('token') || key.includes('account')) {
                            localStorage.removeItem(key);
                            console.log('Removed localStorage key:', key);
                        }
                    });
                    
                    Object.keys(sessionStorage).forEach(key => {
                        if (key.includes('msal') || key.includes('auth') || key.includes('token') || key.includes('account')) {
                            sessionStorage.removeItem(key);
                            console.log('Removed sessionStorage key:', key);
                        }
                    });
                    
                    console.log('Authentication cache clearing completed');
                } catch (e) {
                    console.error('Error clearing auth cache:', e);
                }
            },
            
            // Force complete logout
            forceLogout: function() {
                try {
                    console.log('Force logout initiated...');
                    
                    // Clear all storage
                    localStorage.clear();
                    sessionStorage.clear();
                    
                    // Clear cookies
                    document.cookie.split(';').forEach(function(c) { 
                        document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date().toUTCString() + ';path=/'); 
                    });
                    
                    console.log('Force logout completed');
                    
                    // Redirect to home
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 100);
                } catch (e) {
                    console.error('Error during force logout:', e);
                    window.location.href = '/';
                }
            }
        };
        
        // Auto-setup timeout on mobile devices
        if (window.blazorAuthHelper.isMobile()) {
            window.blazorAuthHelper.setupAuthTimeout();
        }
        
        // Add global logout helper
        window.globalLogout = function() {
            window.blazorAuthHelper.forceLogout();
        };
    </script>
</body>
