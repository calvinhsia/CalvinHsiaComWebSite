<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Development cache busting - enable for development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>CalvinHsia</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/wordscape-game.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        Loading...
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    
    <!-- UPDATED: WordScape JavaScript Functions for larger circle -->
    <script>
        // Function to convert client coordinates to SVG coordinates
        window.convertClientToSVGCoordinates = function (svgElementRef, clientX, clientY) {
            try {
                // Get the actual SVG element
                let svgElement = svgElementRef;
                
                // Handle Blazor ElementReference
                if (!svgElement || svgElement.tagName !== 'svg') {
                    svgElement = document.querySelector('.letter-wheel svg');
                }
                
                if (!svgElement) {
                    console.error('SVG element not found for coordinate conversion');
                    return [0, 0];
                }
                
                const rect = svgElement.getBoundingClientRect();
                // UPDATED: Use correct viewBox dimensions for 25% larger circle (455x455)
                const viewBox = svgElement.viewBox.baseVal || { width: 455, height: 455 };
                
                // Convert client coordinates to SVG coordinates
                const svgX = (clientX - rect.left) * (viewBox.width / rect.width);
                const svgY = (clientY - rect.top) * (viewBox.height / rect.height);
                
                return [svgX, svgY];
            } catch (e) {
                console.error('Error converting coordinates:', e);
                return [0, 0];
            }
        };
        
        // Function to open URLs in a new tab
        window.openUrl = function (url) {
            window.open(url, '_blank');
        };
    </script>
    
    <!-- Enhanced authentication helper -->
    <script>
        // Enhanced authentication helper
        window.blazorAuthHelper = {
            isMobile: function () {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            },
            
            setupAuthTimeout: function () {
                if (this.isMobile()) {
                    // Increase timeout for mobile and check auth state first
                    setTimeout(function () {
                        if (window.location.pathname.includes('/authentication/login-callback')) {
                            console.log('Auth callback timeout - checking if user is actually authenticated');
                            // Instead of immediately redirecting, trigger the auth check
                            if (window.DotNet) {
                                console.log('Triggering auth status check from timeout');
                                // This will be handled by the CheckAuthAndRedirect method
                            } else {
                                console.log('DotNet not available, redirecting to home');
                                window.location.href = '/';
                            }
                        }
                    }, 15000); // Increase to 15 seconds
                }
            },
            
            // Clear authentication cache
            clearAuthCache: function () {
                try {
                    console.log('Clearing authentication cache...');
                    
                    // Clear MSAL specific items
                    Object.keys(localStorage).forEach(key => {
                        if (key.includes('msal') || key.includes('auth') || key.includes('token') || key.includes('account')) {
                            localStorage.removeItem(key);
                            console.log('Removed localStorage key:', key);
                        }
                    });
                    
                    Object.keys(sessionStorage).forEach(key => {
                        if (key.includes('msal') || key.includes('auth') || key.includes('token') || key.includes('account')) {
                            sessionStorage.removeItem(key);
                        }
                    });
                    
                    console.log('Authentication cache clearing completed');
                } catch (e) {
                    console.error('Error clearing auth cache:', e);
                }
            },
            
            // Force complete logout
            forceLogout: function() {
                try {
                    console.log('Force logout initiated...');
                    
                    // Clear all storage
                    localStorage.clear();
                    sessionStorage.clear();
                    
                    // Clear cookies
                    document.cookie.split(';').forEach(function(c) { 
                        document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date().toUTCString() + ';path=/'); 
                    });
                    
                    console.log('Force logout completed');
                    
                    // Redirect to home
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 100);
                } catch (e) {
                    console.error('Error during force logout:', e);
                    window.location.href = '/';
                }
            }
        };
        
        // Auto-setup timeout on mobile devices
        if (window.blazorAuthHelper.isMobile()) {
            window.blazorAuthHelper.setupAuthTimeout();
        }
        
        // Add global logout helper
        window.globalLogout = function() {
            window.blazorAuthHelper.forceLogout();
        };
    </script>
</body>

</html>
