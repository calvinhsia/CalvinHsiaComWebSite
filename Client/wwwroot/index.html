<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Development cache busting - enable for development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>CalvinHsia</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/wordscape-game.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        Loading...
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    
    <!-- UPDATED: WordScape JavaScript Functions for mobile-friendly wheel -->
    <script>
        // Function to convert client coordinates to SVG coordinates
        window.convertClientToSVGCoordinates = function (svgElementRef, clientX, clientY) {
            try {
                // Get the actual SVG element
                let svgElement = svgElementRef;
                
                // Handle Blazor ElementReference
                if (!svgElement || svgElement.tagName !== 'svg') {
                    svgElement = document.querySelector('.letter-wheel svg');
                }
                
                if (!svgElement) {
                    console.error('SVG element not found for coordinate conversion');
                    return [0, 0];
                }
                
                const rect = svgElement.getBoundingClientRect();
                // UPDATED: Use correct viewBox dimensions (600x600)
                const viewBox = svgElement.viewBox.baseVal || { width: 600, height: 600 };
                
                // Convert client coordinates to SVG coordinates
                const svgX = (clientX - rect.left) * (viewBox.width / rect.width);
                const svgY = (clientY - rect.top) * (viewBox.height / rect.height);
                
                return [svgX, svgY];
            } catch (error) {
                console.error('Error converting coordinates:', error);
                return [0, 0];
            }
        };

        // Function to open URL in new tab/window
        window.openUrl = function (url) {
            window.open(url, '_blank');
        };

        // FIXED: Function to detect emoji support and apply fallback
        window.detectEmojiSupport = function() {
            // Test if the browser can render emojis properly
            const testElement = document.createElement('canvas');
            const ctx = testElement.getContext('2d');
            
            if (!ctx) return false;
            
            // Set canvas properties
            testElement.width = testElement.height = 16;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.font = '16px Arial, sans-serif';
            
            // Try to render a gear emoji
            ctx.fillText('⚙️', 8, 8);
            
            // Check if anything was rendered (non-transparent pixels)
            const imageData = ctx.getImageData(0, 0, 16, 16);
            let hasPixels = false;
            
            for (let i = 0; i < imageData.data.length; i += 4) {
                if (imageData.data[i + 3] > 0) { // Alpha channel
                    hasPixels = true;
                    break;
                }
            }
            
            if (!hasPixels) {
                // No emoji support detected, show text fallbacks
                document.body.classList.add('no-emoji-support');
            }
            
            return hasPixels;
        };

        // Page visibility handler for game state saving
        window.addPageVisibilityHandler = function(dotNetHelper) {
            document.addEventListener('visibilitychange', function() {
                const isVisible = !document.hidden;
                dotNetHelper.invokeMethodAsync('OnPageVisibilityChanged', isVisible);
            });
        };

        // Initialize emoji detection when page loads
        document.addEventListener('DOMContentLoaded', function() {
            window.detectEmojiSupport();
        });

        // UPDATED: Mobile-friendly letter wheel visibility handler
        window.ensureLetterWheelVisibility = function() {
            const letterWheel = document.querySelector('.letter-wheel');
            const svg = document.querySelector('.letter-wheel svg');
            const container = document.querySelector('.narrow-circle-container');
            const controls = document.querySelector('.narrow-layout-controls');
            
            if (!letterWheel || !svg) {
                // Only retry if elements are actually missing (not just during navigation)
                if (window.location.pathname.includes('/wordscape')) {
                    console.log('Letter wheel elements not found, will retry...');
                    setTimeout(window.ensureLetterWheelVisibility, 500);
                }
                return;
            }
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Only log if we haven't logged this size recently
            if (!window.lastLoggedSize || 
                Math.abs(window.lastLoggedSize.width - windowWidth) > 20 || 
                Math.abs(window.lastLoggedSize.height - windowHeight) > 20) {
                
                console.log(`📏 Adjusting mobile-friendly letter wheel for: ${windowWidth}x${windowHeight}`);
                window.lastLoggedSize = { width: windowWidth, height: windowHeight };
            }
            
            // Calculate mobile-friendly size based on viewport - SMALLER for Android compatibility
            let minSize = Math.max(200, Math.min(windowWidth * 0.65, windowHeight * 0.4));
            if (windowWidth < 500) {
                minSize = Math.max(180, windowWidth * 0.6);
            }
            if (windowWidth < 400) {
                minSize = Math.max(160, windowWidth * 0.55);
            }
            if (windowWidth < 320) {
                minSize = 160; // Fixed minimum for ultra-small screens
            }
            
            // Only apply styles if size actually changed
            if (!svg._lastAppliedSize || Math.abs(svg._lastAppliedSize - minSize) > 10) {
                // Force container visibility and sizing - Mobile-friendly with smaller dimensions
                if (controls) {
                    controls.style.display = 'block';
                    controls.style.visibility = 'visible';
                    controls.style.opacity = '1';
                    controls.style.minWidth = `${minSize + 60}px`; // Reduced extra space
                    controls.style.minHeight = `${minSize + 60}px`; // Reduced extra space
                    controls.style.width = '100%';
                    controls.style.maxWidth = '95vw';
                    controls.style.position = 'relative';
                    controls.style.overflow = 'visible';
                }
                
                if (container) {
                    container.style.display = 'flex';
                    container.style.visibility = 'visible';
                    container.style.opacity = '1';
                    container.style.minWidth = `${minSize + 30}px`; // Reduced space for smaller container
                    container.style.minHeight = `${minSize + 30}px`; // Reduced space for smaller container
                    container.style.alignItems = 'center';
                    container.style.justifyContent = 'center';
                    container.style.position = 'relative';
                    container.style.overflow = 'visible';
                }
                
                // Force letter wheel visibility and sizing - Smaller for mobile
                letterWheel.style.display = 'block';
                letterWheel.style.visibility = 'visible';
                letterWheel.style.opacity = '1';
                letterWheel.style.minWidth = `${minSize}px`;
                letterWheel.style.minHeight = `${minSize}px`;
                letterWheel.style.position = 'relative';
                letterWheel.style.margin = '0 auto';
                
                // Force SVG sizing - Smaller for mobile
                svg.style.display = 'block';
                svg.style.visibility = 'visible';
                svg.style.opacity = '1';
                svg.style.width = `${minSize}px`;
                svg.style.height = `${minSize}px`;
                svg.style.minWidth = `${minSize}px`;
                svg.style.minHeight = `${minSize}px`;
                svg.style.maxWidth = '85vw';
                svg.style.maxHeight = '85vw';
                svg.style.margin = '0 auto';
                svg.style.position = 'relative';
                
                // Force draggable container corner controls visibility (positioned at very edges)
                const draggableCorners = document.querySelectorAll('.draggable-wheel-container .corner');
                draggableCorners.forEach((corner) => {
                    corner.style.display = 'block';
                    corner.style.visibility = 'visible';
                    corner.style.opacity = '1';
                    corner.style.position = 'absolute';
                    corner.style.zIndex = '35';
                    corner.style.pointerEvents = 'auto';
                    corner.style.touchAction = 'auto';
                    corner.style.cursor = 'default';
                    
                    // Position at very edges (0px margins)
                    if (corner.classList.contains('corner-topleft')) {
                        corner.style.top = '0px';
                        corner.style.left = '0px';
                    } else if (corner.classList.contains('corner-topright')) {
                        corner.style.top = '0px';
                        corner.style.right = '0px';
                    } else if (corner.classList.contains('corner-bottomleft')) {
                        corner.style.bottom = '0px';
                        corner.style.left = '0px';
                    } else if (corner.classList.contains('corner-bottomright')) {
                        corner.style.bottom = '0px';
                        corner.style.right = '0px';
                    }
                });
                
                // Force shuffle button visibility
                const shuffleButton = document.querySelector('.center-shuffle-button');
                if (shuffleButton) {
                    const buttonSize = Math.max(30, Math.min(40, minSize * 0.15));
                    shuffleButton.style.display = 'flex';
                    shuffleButton.style.visibility = 'visible';
                    shuffleButton.style.opacity = '1';
                    shuffleButton.style.position = 'absolute';
                    shuffleButton.style.top = '50%';
                    shuffleButton.style.left = '50%';
                    shuffleButton.style.transform = 'translate(-50%, -50%)';
                    shuffleButton.style.zIndex = '30';
                    shuffleButton.style.width = `${buttonSize}px`;
                    shuffleButton.style.height = `${buttonSize}px`;
                    shuffleButton.style.fontSize = `${Math.max(14, buttonSize * 0.4)}px`;
                    shuffleButton.style.pointerEvents = 'auto';
                    shuffleButton.style.touchAction = 'manipulation';
                }
                
                svg._lastAppliedSize = minSize;
                console.log(`✅ Android-friendly letter wheel with edge corners optimized: ${minSize}px`);
            }
        };
        
        // Monitor window resize
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(window.ensureLetterWheelVisibility, 100);
        });
        
        // Also check on window load
        window.addEventListener('load', function() {
            setTimeout(window.ensureLetterWheelVisibility, 500);
            
            // UPDATED: Android-friendly CSS override styles for edge-positioned container corners
            const style = document.createElement('style');
            style.id = 'wordscape-visibility-override';
            style.textContent = `
                /* Critical visibility overrides for Android-friendly wheel with edge corners */
                .narrow-layout-controls,
                .narrow-circle-container,
                .letter-wheel,
                .letter-wheel svg,
                .draggable-wheel-container .corner {
                    display: block !important;
                    visibility: visible !important;
                    opacity: 1 !important;
                }
                
                .narrow-layout-controls {
                    min-width: 280px !important;
                    min-height: 280px !important;
                    position: relative !important;
                    width: 100% !important;
                    max-width: 95vw !important;
                }
                
                .narrow-circle-container {
                    min-width: 250px !important;
                    min-height: 250px !important;
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    position: relative !important;
                    margin: 0 auto !important;
                }
                
                .letter-wheel svg {
                    min-width: 220px !important;
                    min-height: 220px !important;
                    margin: 0 auto !important;
                    max-width: 85vw !important;
                    max-height: 85vw !important;
                }
                
                .draggable-wheel-container .corner {
                    position: absolute !important;
                    z-index: 35 !important;
                    pointer-events: auto !important;
                    touch-action: auto !important;
                    cursor: default !important;
                }
                
                .center-shuffle-button {
                    display: flex !important;
                    visibility: visible !important;
                    opacity: 1 !important;
                    position: absolute !important;
                    top: 50% !important;
                    left: 50% !important;
                    transform: translate(-50%, -50%) !important;
                    z-index: 30 !important;
                    width: 40px !important;
                    height: 40px !important;
                    font-size: 18px !important;
                    pointer-events: auto !important;
                    touch-action: manipulation !important;
                }
                
                /* Mobile-specific overrides */
                @media (max-width: 768px) {
                    .wordscape-container {
                        padding: 5px !important;
                    }
                    
                    .draggable-wheel-container {
                        min-width: min(95vw, 300px) !important;
                        min-height: min(95vw, 300px) !important;
                        width: min(95vw, 300px) !important;
                        height: min(95vw, 300px) !important;
                        padding: 25px !important;
                        display: block !important;
                        visibility: visible !important;
                        opacity: 1 !important;
                        overflow: visible !important;
                    }
                    
                    .letter-wheel svg {
                        min-width: 180px !important;
                        min-height: 180px !important;
                    }
                    
                    .draggable-wheel-container .corner {
                        padding: 3px 6px !important;
                        min-width: 50px !important;
                        font-size: 11px !important;
                    }
                    
                    .draggable-wheel-container .corner-value {
                        font-size: 13px !important;
                    }
                    
                    .draggable-wheel-container .corner-label {
                        font-size: 7px !important;
                    }
                }
                
                @media (max-width: 400px) {
                    .draggable-wheel-container {
                        min-width: min(98vw, 280px) !important;
                        min-height: min(98vw, 280px) !important;
                        width: min(98vw, 280px) !important;
                        height: min(98vw, 280px) !important;
                        padding: 20px !important;
                    }
                    
                    .letter-wheel svg {
                        width: 200px !important;
                        height: 200px !important;
                        min-width: 180px !important;
                        min-height: 180px !important;
                    }
                    
                    .draggable-wheel-container .corner {
                        padding: 2px 5px !important;
                        min-width: 45px !important;
                        font-size: 10px !important;
                    }
                    
                    .draggable-wheel-container .corner-value {
                        font-size: 12px !important;
                    }
                    
                    .draggable-wheel-container .corner-label {
                        font-size: 6px !important;
                    }
                    
                    .center-shuffle-button {
                        width: 35px !important;
                        height: 35px !important;
                        font-size: 16px !important;
                    }
                }
                
                @media (max-width: 320px) {
                    .draggable-wheel-container {
                        min-width: 300px !important;
                        min-height: 300px !important;
                        width: 300px !important;
                        height: 300px !important;
                        padding: 15px !important;
                    }
                    
                    .letter-wheel svg {
                        width: 200px !important;
                        height: 200px !important;
                        min-width: 180px !important;
                        min-height: 180px !important;
                    }
                    
                    .draggable-wheel-container .corner {
                        padding: 2px 4px !important;
                        min-width: 40px !important;
                        font-size: 9px !important;
                    }
                    
                    .draggable-wheel-container .corner-value {
                        font-size: 11px !important;
                    }
                    
                    .draggable-wheel-container .corner-label {
                        font-size: 6px !important;
                    }
                    
                    .center-shuffle-button {
                        width: 30px !important;
                        height: 30px !important;
                        font-size: 14px !important;
                    }
                }
                
                /* UPDATED: Ensure draggable container is Android-friendly */
                .draggable-wheel-container {
                    display: block !important;
                    visibility: visible !important;
                    opacity: 1 !important;
                    background: rgba(255, 255, 0, 0.08) !important;
                    border: 3px dashed rgba(255, 255, 0, 0.4) !important;
                    border-radius: 25px !important;
                    min-width: 320px !important;
                    min-height: 320px !important;
                    max-width: 95vw !important;
                    width: min(95vw, 400px) !important;
                    height: min(95vw, 400px) !important;
                    padding: 30px !important;
                    touch-action: none !important;
                    cursor: grab !important;
                    position: relative !important;
                    overflow: visible !important;
                    box-sizing: border-box !important;
                }
                
                .draggable-wheel-container:active {
                    cursor: grabbing !important;
                }
                
                /* Ensure corner controls are positioned at very edges */
                .draggable-wheel-container .corner-topleft {
                    top: 0px !important;
                    left: 0px !important;
                }
                
                .draggable-wheel-container .corner-topright {
                    top: 0px !important;
                    right: 0px !important;
                }
                
                .draggable-wheel-container .corner-bottomleft {
                    bottom: 0px !important;
                    left: 0px !important;
                }
                
                .draggable-wheel-container .corner-bottomright {
                    bottom: 0px !important;
                    right: 0px !important;
                }
            `;
            
            if (!document.head.querySelector('#wordscape-visibility-override')) {
                document.head.appendChild(style);
                console.log('✅ Mobile-friendly wheel visibility override styles injected');
            }
        });
    </script>
    
    <!-- Enhanced authentication helper -->
    <script>
        // Enhanced authentication helper
        window.blazorAuthHelper = {
            isMobile: function () {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            },
            
            setupAuthTimeout: function () {
                if (this.isMobile()) {
                    // Increase timeout for mobile and check auth state first
                    setTimeout(function () {
                        if (window.location.pathname.includes('/authentication/login-callback')) {
                            console.log('Auth callback timeout - checking if user is actually authenticated');
                            // Instead of immediately redirecting, trigger the auth check
                            if (window.DotNet) {
                                console.log('Triggering auth status check from timeout');
                                // This will be handled by the CheckAuthAndRedirect method
                            } else {
                                console.log('DotNet not available, redirecting to home');
                                window.location.href = '/';
                            }
                        }
                    }, 15000); // Increase to 15 seconds
                }
            },
            
            // Clear authentication cache
            clearAuthCache: function () {
                try {
                    console.log('Clearing authentication cache...');
                    
                    // Clear MSAL specific items
                    Object.keys(localStorage).forEach(key => {
                        if (key.includes('msal') || key.includes('auth') || key.includes('token') || key.includes('account')) {
                            localStorage.removeItem(key);
                            console.log('Removed localStorage key:', key);
                        }
                    });
                    
                    Object.keys(sessionStorage).forEach(key => {
                        if (key.includes('msal') || key.includes('auth') || key.includes('token') || key.includes('account')) {
                            sessionStorage.removeItem(key);
                        }
                    });
                    
                    console.log('Authentication cache clearing completed');
                } catch (e) {
                    console.error('Error clearing auth cache:', e);
                }
            },
            
            // Force complete logout
            forceLogout: function() {
                try {
                    console.log('Force logout initiated...');
                    
                    // Clear all storage
                    localStorage.clear();
                    sessionStorage.clear();
                    
                    // Clear cookies
                    document.cookie.split(';').forEach(function(c) { 
                        document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date().toUTCString() + ';path=/'); 
                    });
                    
                    console.log('Force logout completed');
                    
                    // Redirect to home
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 100);
                } catch (e) {
                    console.error('Error during force logout:', e);
                    window.location.href = '/';
                }
            }
        };
        
        // Auto-setup timeout on mobile devices
        if (window.blazorAuthHelper.isMobile()) {
            window.blazorAuthHelper.setupAuthTimeout();
        }
        
        // Add global logout helper
        window.globalLogout = function() {
            window.blazorAuthHelper.forceLogout();
        };
    </script>
</body>

</html>
